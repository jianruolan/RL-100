name: piper_pick_and_place_2d

task_name: piper_pick_and_place

# Zarr 和模型输入都保持 84x84 RGB；训练脚本显式选择 encoder_type=drq，
# 由 DP3Encoder_with2D 构造仓库原生 DrQEncoder([3,84,84], 32)。
crop_shape: null

shape_meta: &shape_meta
  obs:
    image:
      shape: [3, 84, 84]
      type: rgb
    # 与 3D 共用同一个 Zarr。2D policy 设置 w_pc=False，不编码该字段。
    point_cloud:
      shape: [512, 3]
      type: point_cloud
    agent_pos:
      shape: [7]
      type: low_dim
  action:
    shape: [7]

env_runner: null

dataset: &dataset
  _target_: rl_100.dataset.adroit_dataset.AdroitDataset
  zarr_path: data/piper_pick_and_place.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: ${training.seed}
  # 24 条成功轨迹中约 3 条完整 episode 用于 validation。
  val_ratio: 0.125
  max_train_episodes: null
  pre_image_norm: False
  controlled_dims: 7

norm_dataset: *dataset

critic_dataset:
  <<: *dataset
  val_ratio: 0.0

scale_dataset:
  <<: *dataset
  val_ratio: 0.0
  scale_strategy: dynamic
