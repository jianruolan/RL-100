name: piper_soft_block_contact_2d

task_name: piper_soft_block_contact

# 纯离线的 Piper 2D 任务配置。
# Zarr 仍保留 point_cloud，便于与 3D 实验共用数据；RL1002D 的
# policy.w_pc=False 会忽略点云，只编码 RGB 图像和六维关节位置。
crop_shape: null

shape_meta: &shape_meta
  obs:
    image:
      shape: [3, 84, 84]
      type: rgb
    point_cloud:
      shape: [512, 3]
      type: point_cloud
    agent_pos:
      shape: [6]
      type: low_dim
  action:
    shape: [6]

# 尚未实现真机环境 runner。训练中的仿真/真机 rollout 会被跳过，
# validation 仍然使用按 episode 划分出的离线验证集。
env_runner: null

dataset: &dataset
  _target_: rl_100.dataset.adroit_dataset.AdroitDataset
  zarr_path: data/piper_soft_block_contact_50_trimmed.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: ${training.seed}
  # 50 条轨迹中固定留出约 5 条完整 episode 做验证，避免帧级数据泄漏。
  val_ratio: 0.1
  max_train_episodes: null
  pre_image_norm: False
  controlled_dims: 6

norm_dataset: *dataset

critic_dataset:
  <<: *dataset
  val_ratio: 0.0

scale_dataset:
  <<: *dataset
  val_ratio: 0.0
  scale_strategy: dynamic
