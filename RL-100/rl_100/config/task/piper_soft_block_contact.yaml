name: piper_soft_block_contact

task_name: piper_soft_block_contact

# Processed dataset schema:
#   raw state/action: 7 (six arm joints plus a constant gripper channel)
#   image: 3x84x84, point_cloud: 512x3
shape_meta: &shape_meta
  obs:
    image:
      shape: [3, 84, 84]
      type: rgb
    point_cloud:
      shape: [512, 3]
      type: point_cloud
    agent_pos:
      shape: [6]
      type: low_dim
  action:
    shape: [6]

# Stage 1 is deliberately offline-only.  A real Piper runner must implement
# reset/step, D435i preprocessing, safety limits, and contact termination
# before rollout evaluation or online RL is enabled.
env_runner: null

dataset: &dataset
  _target_: rl_100.dataset.adroit_dataset.AdroitDataset
  zarr_path: data/piper_soft_block_contact_50.zarr
  horizon: ${horizon}
  pad_before: ${eval:'${n_obs_steps}-1'}
  pad_after: ${eval:'${n_action_steps}-1'}
  seed: 42
  # Eight episodes: reserve one complete episode for validation.
  val_ratio: 0.125
  max_train_episodes: null
  pre_image_norm: False
  # Drop the seventh, constant gripper channel from observations and actions.
  controlled_dims: 6

norm_dataset: *dataset

critic_dataset:
  <<: *dataset
  val_ratio: 0.0

scale_dataset:
  <<: *dataset
  val_ratio: 0.0
  scale_strategy: dynamic
